<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalized Study Guide Generator</title>
    <style>
        /* Dark Theme & Standard UI Styling */
        :root {
            --color-bg-dark: #0f172a;
            --color-card-dark: #1e293b;
            --color-text-light: #e2e8f0;
            --color-accent-blue: #38bdf8;
            --color-accent-green: #10b981;
            --color-accent-teal: #14b8a6;
            --color-warning-yellow: #facc15;
            --color-error-red: #ef4444;
            --color-purple: #a855f7;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: var(--color-bg-dark);
            color: var(--color-text-light);
            transition: background-color 0.3s;
        }
        
        h1 { 
            color: var(--color-accent-blue); 
            border-bottom: 2px solid var(--color-accent-blue); 
            padding-bottom: 12px; 
            font-size: 2.2em;
            margin-bottom: 25px;
        }
        h2 { color: var(--color-accent-green); margin-top: 35px; font-size: 1.8em; }
        h3 { 
            color: var(--color-accent-teal); 
            margin-top: 25px; 
            border-bottom: 1px dashed var(--color-accent-teal); 
            padding-bottom: 8px; 
            font-size: 1.4em;
        }
        
        /* Form Styling */
        #uploadForm {
            padding: 25px;
            background: var(--color-card-dark);
            border-radius: 12px;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.3);
            margin-bottom: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px; 
            align-items: end;
        }

        #uploadForm label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: var(--color-accent-blue);
        }
        
        input[type="file"], input[type="number"], input[type="text"] { 
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #334155; 
            background-color: #0f172a;
            color: var(--color-text-light);
            padding: 10px; 
            border-radius: 6px; 
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: var(--color-accent-blue);
            outline: none;
        }

        button {
            grid-column: 1 / -1; 
            padding: 12px 25px;
            background-color: var(--color-accent-green);
            color: var(--color-bg-dark);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.1s;
        }
        button:hover:not(:disabled) { 
            background-color: #059669; /* Darker green for hover */
            transform: translateY(-1px);
        }
        button:disabled {
            background-color: #3f6212;
            cursor: not-allowed;
        }

        /* NEW: Plan Mode Selector Styling */
        #planModeContainer {
            grid-column: 1 / -1; /* Span the whole row */
            padding: 10px 0;
            border-bottom: 1px dashed #334155;
            margin-bottom: 10px;
        }
        .radio-group label {
            display: inline-flex;
            align-items: center;
            margin-right: 20px;
            font-weight: normal;
            color: var(--color-text-light);
            cursor: pointer;
        }
        .radio-group input[type="radio"] {
            margin-right: 8px;
            width: auto;
        }
        
        /* Conditional Input Groups */
        .conditional-input {
            grid-column: span 1; 
        }

        /* Results and Loading */
        #results { 
            margin-top: 20px; 
            padding: 30px; 
            background: var(--color-card-dark);
            border-radius: 12px;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.8s ease-out;
        }
        .loading { 
            color: var(--color-accent-blue); 
            font-style: italic; 
            padding: 15px; 
            border: 1px solid #334155;
            background: #1e293b;
            border-radius: 6px;
            text-align: center;
            display: flex; /* Use flexbox for alignment */
            align-items: center;
            justify-content: center;
            font-weight: 600; 
        }
        .error { 
            color: var(--color-error-red); 
            font-weight: bold; 
            background: #450a0a; 
            padding: 15px; 
            border: 1px solid var(--color-error-red);
            border-radius: 6px; 
        }

        /* Spinner Animation (The Fun Part!) */
        .spinner-cube {
            width: 20px;
            height: 20px;
            margin-right: 15px;
            background-color: var(--color-accent-blue);
            display: inline-block;
            vertical-align: middle;
            animation: cube-spin 1.5s infinite ease-in-out;
            border-radius: 4px;
        }

        @keyframes cube-spin {
            0% { transform: perspective(120px) rotateX(0deg) rotateY(0deg); }
            50% { transform: perspective(120px) rotateX(-180deg) rotateY(0deg); }
            100% { transform: perspective(120px) rotateX(-180deg) rotateY(-180deg); }
        }

        /* Study Guide Specifics */
        ul { padding-left: 20px; line-height: 1.6; }
        
        /* Study Plan Days - TARGETING THE UL .study-plan-list */
        .study-plan-list { 
            list-style: none; /* Remove default bullet/numbering */
            padding-left: 0;
            counter-reset: custom-counter; /* Initialize the counter on the UL */
        }
        
        .study-plan-list > li { /* Targeting direct children LI of the UL */
            margin-bottom: 20px; 
            padding: 15px; 
            background: #152233; 
            border-left: 5px solid var(--color-accent-green); 
            border-radius: 8px; 
            counter-increment: custom-counter; /* Increment the counter for each Day LI */
        }

        /* Custom 'Day X.' content */
        .study-plan-list > li::before {
            content: "Day " counter(custom-counter) ".";
            font-weight: bold;
            color: var(--color-accent-green);
            margin-right: 10px;
        }
        
        .study-plan-list > li strong { 
            color: var(--color-accent-blue); 
            display: block; 
            margin-bottom: 8px; 
            font-size: 1.15em; 
            padding-top: 5px;
        }
        
        /* Inner Task List - Now a normal bulleted list */
        .study-plan-list > li > ul { 
            list-style-type: disc; /* Ensure it's a normal bullet list */
            padding-left: 20px; /* Indent the bullets */
        }

        .study-plan-list > li > ul > li { 
            background: #1f3044; 
            border-left: 3px solid var(--color-accent-teal); 
            font-size: 0.95em; 
            padding: 8px;
            margin-bottom: 5px;
            border-radius: 4px;
        }
        
        /* Key Terms Styling */
        #results > p:first-of-type { 
            background: #422006; 
            color: var(--color-warning-yellow); 
            padding: 18px; 
            border-radius: 6px; 
            font-weight: bold;
            border: 1px solid #78350f;
            line-height: 1.8;
            margin-bottom: 20px;
        }
        
        /* Question Lists & Answers */
        .question-list { list-style: none; padding-left: 0; }
        .question-list li {
            padding: 12px;
            margin-bottom: 15px;
            border-left: 4px solid var(--color-warning-yellow); 
            background: #253140; 
            font-weight: 500;
            border-radius: 6px;
        }
        .laq-list li {
            border-left: 4px solid var(--color-purple); /* Changed color for LAQs */
            background: #2e1c3a;
        }
        .question-list .answer {
            margin-top: 10px;
            padding: 10px;
            background: var(--color-bg-dark); /* Dark background for answer box */
            border-top: 1px dashed #334155;
            font-size: 0.9em;
            font-weight: normal;
            color: var(--color-text-light);
        }
        .answer strong {
            color: var(--color-accent-green);
            display: block;
            margin-bottom: 5px;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            #uploadForm {
                grid-template-columns: 1fr;
            }
            button {
                grid-column: 1;
            }
            body {
                padding: 15px;
            }
            #planModeContainer {
                grid-column: 1;
            }
        }

        /* Fade-in Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <h1>📚 Personalized Study Guide Generator</h1>
    
    <form id="uploadForm" enctype="multipart/form-data">
        <div id="planModeContainer">
            <label>Select Plan Scope:</label>
            <div class="radio-group">
                <label>
                    <input type="radio" name="plan_mode" value="subject" id="subjectMode" checked>
                    Full Subject Exam
                </label>
                <label>
                    <input type="radio" name="plan_mode" value="module" id="moduleMode">
                    Single Module Focus
                </label>
            </div>
        </div>
        
        <div>
            <label for="daysInput">Study Days (1-10):</label>
            <input type="number" id="daysInput" name="study_days" min="1" max="10" value="3" required>
        </div>
        
        <div id="moduleNumberGroup" class="conditional-input" style="display:none;">
            <label for="moduleInput">Specific Module Number:</label>
            <input type="text" id="moduleInput" name="module_number" placeholder="e.g., Module 3: Networking Basics"> 
        </div>
        
        <div id="allModulesGroup" class="conditional-input">
            <label for="allModulesInput">All Modules Notes (Required for Subject Mode):</label>
            <input type="file" name="all_modules_file" id="allModulesInput" accept=".pdf,.png,.jpg,.jpeg,.txt" multiple required>
        </div>
        
        <div id="singleModuleGroup" class="conditional-input" style="display:none;">
            <label for="fileInput">Single Module Notes/Book (Required for Module Mode):</label>
            <input type="file" name="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg,.txt">
        </div>

        <div>
            <label for="paperInput">Previous Papers (Optional):</label>
            <input type="file" name="past_paper" id="paperInput" accept=".pdf,.txt" multiple> 
        </div>
        
        <button type="submit">Generate Study Guide</button>
    </form>
    
    <div id="loading" class="loading" style="display:none;">
        <div class="spinner-cube"></div> 
        <span id="loading-text">Fueling the study genius... analyzing concepts!</span>
    </div>
    <div id="results">
        </div>

    <script>
        const loadingMessages = [
            "Fueling the study genius... analyzing concepts!",
            "Crunching past papers. We found the question nobody asked for!",
            "Synthesizing knowledge. Hold tight, your brain expansion pack is loading.",
            "Filtering procrastination... (Warning: this step may fail on Day 7).",
            "Just a moment, reading every single page... twice.",
            "Predicting the future of your exams. Please remain calm."
        ];
        
        let messageIndex = 0;
        let messageInterval;

        function startMessageCycle() {
            const loadingTextSpan = document.getElementById('loading-text');
            messageIndex = 0; // Reset index every time we start
            loadingTextSpan.textContent = loadingMessages[messageIndex]; // Set initial message
            
            messageInterval = setInterval(() => {
                messageIndex = (messageIndex + 1) % loadingMessages.length;
                loadingTextSpan.textContent = loadingMessages[messageIndex];
            }, 5000); // Change message every 5 seconds
        }

        function stopMessageCycle() {
            clearInterval(messageInterval);
        }

        // NEW: Toggle visibility of inputs based on Plan Mode
        function toggleInputFields() {
            const mode = document.querySelector('input[name="plan_mode"]:checked').value;
            const moduleGroup = document.getElementById('moduleNumberGroup');
            const allModulesGroup = document.getElementById('allModulesGroup');
            const singleModuleGroup = document.getElementById('singleModuleGroup');
            const singleModuleInput = document.getElementById('fileInput');
            const allModulesInput = document.getElementById('allModulesInput');

            if (mode === 'module') {
                moduleGroup.style.display = 'block';
                singleModuleGroup.style.display = 'block';
                allModulesGroup.style.display = 'none';
                singleModuleInput.required = true;
                allModulesInput.required = false;
                singleModuleInput.name = 'file'; // Use the expected backend field name
            } else { // subject mode
                moduleGroup.style.display = 'none';
                singleModuleGroup.style.display = 'none';
                allModulesGroup.style.display = 'block';
                singleModuleInput.required = false;
                allModulesInput.required = true;
                singleModuleInput.name = 'file_disabled'; // Prevent sending this field
            }
        }
        
        // Initialize the fields on load
        document.addEventListener('DOMContentLoaded', toggleInputFields);
        
        // Listen for radio button changes
        document.querySelectorAll('input[name="plan_mode"]').forEach(radio => {
            radio.addEventListener('change', toggleInputFields);
        });


        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const mode = document.querySelector('input[name="plan_mode"]:checked').value;
            const daysInput = document.getElementById('daysInput');
            const paperInput = document.getElementById('paperInput');
            const moduleInput = document.getElementById('moduleInput'); 
            const moduleNumber = moduleInput.value.trim(); 
            
            const mainFileInput = (mode === 'module') ? document.getElementById('fileInput') : document.getElementById('allModulesInput');
            const files = mainFileInput.files;

            const loading = document.getElementById('loading');
            const resultsDiv = document.getElementById('results');

            if (files.length === 0) {
                resultsDiv.innerHTML = '<p class="error">Please select study notes files to begin.</p>';
                return;
            }

            loading.style.display = 'flex'; // Show loading
            startMessageCycle();            // Start animation and messages
            resultsDiv.innerHTML = '';
            
            const submitButton = document.querySelector('button[type="submit"]');
            submitButton.disabled = true;

            const formData = new FormData();
            formData.append('plan_mode', mode);
            formData.append('study_days', daysInput.value);
            
            // Append main study files based on mode
            if (mode === 'module') {
                formData.append('file', files[0]);
                if (moduleNumber) {
                    formData.append('module_number', moduleNumber);
                }
            } else { // subject mode
                for (const file of files) {
                    formData.append('all_modules_file', file);
                }
            }
            
            // Append optional past papers
            if (paperInput.files.length > 0) {
                for (const pastPaper of paperInput.files) {
                    formData.append('past_paper', pastPaper);
                }
            }
            
            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                
                stopMessageCycle(); // Stop the message cycling
                loading.style.display = 'none'; // Hide loading

                if (data.success) {
                    const guide = data.study_guide;
                    
                    let html = `<h1>${guide.study_guide_title}</h1>`;
                    html += `<h2>🗓️ ${guide.total_days}-Day Study Plan</h2>`;
                    
                    // --- 1. Key Terms ---
                    html += '<h3>🔑 Key Terms to Master</h3>';
                    html += `<p>${guide.key_terms.join(' | ')}</p>`;

                    // --- 2. High-Priority Practice (Moved up for focus) ---
                    html += '<h3>🎯 High-Priority Practice (Analyzed from Past Papers)</h3>';
                    html += '<ul class="question-list">';
                    guide.high_priority_practice.forEach(practice => {
                        html += `<li>${practice}</li>`;
                    });
                    html += '</ul>';

                    // --- 3. Day-by-Day Study Plan ---
                    html += '<h3>🗓️ Detailed Study Schedule</h3>';
                    html += '<ul class="study-plan-list">';
                    
                    const requestedDays = parseInt(daysInput.value, 10);
                    const planToDisplay = guide.study_plan.slice(0, requestedDays);

                    planToDisplay.forEach(dayPlan => {
                        html += `<li><strong>${dayPlan.focus_topic}</strong>`;
                        html += '<ul>';
                        dayPlan.tasks.forEach(task => {
                            html += `<li>${task}</li>`;
                        });
                        html += '</ul></li>';
                    });
                    html += '</ul>';

                    // --- 4. Predicted Short Answer Questions (SAQs) ---
                    html += '<h3>❓ Predicted Short Answer Questions (SAQs) & Answers</h3>';
                    html += '<ul class="question-list">';
                    guide.short_answer_questions.forEach(qa => {
                        html += `<li>${qa.question}<div class="answer"><strong>Answer:</strong> ${qa.answer}</div></li>`;
                    });
                    html += '</ul>';
                    
                    // --- 5. Predicted Long Answer Questions (LAQs) ---
                    html += '<h3>✍️ Predicted Long Answer Questions (LAQs) & Answers</h3>';
                    html += '<ul class="question-list laq-list">';
                    guide.long_answer_questions.forEach(qa => {
                        html += `<li>${qa.question}<div class="answer"><strong>Answer:</strong> ${qa.answer}</div></li>`;
                    });
                    html += '</ul>'; 
                    
                    resultsDiv.innerHTML = html;
                } else {
                    resultsDiv.innerHTML = `<p class="error">Error: ${data.error}</p>`;
                }
            } catch (error) {
                stopMessageCycle(); // Stop the message cycling
                loading.style.display = 'none';
                resultsDiv.innerHTML = `<p class="error">An unexpected error occurred: ${error.message}</p>`;
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
